// BIND configuration: Authoritative for ext.lab (upstream server)
// Only provides answers for ext.lab, logs all queries

logging {
    channel query_log {
        file "/var/log/named/query.log" versions 3 size 100m;
        severity info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category queries { query_log; };
};

options {
    directory "/var/cache/bind";
    recursion no;
    
    // Only answer for our zone
    allow-query { any; };
};

zone "ext.lab" {
    type master;
    file "/etc/bind/zones/ext.lab.zone";
};
