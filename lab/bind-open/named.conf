// BIND configuration: Open recursive resolver
// Recursion enabled, allows any client

options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    forward only;
};

zone "lab.test" {
    type master;
    file "/etc/bind/zones/lab.test.zone";
};

zone "ext.lab" {
    type stub;
    masters { 10.10.0.200; };
    file "/var/lib/bind/ext.lab.stub";
};
