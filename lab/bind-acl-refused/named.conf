// BIND configuration: Refuses recursion via ACL
// Recursion enabled but ACL denies our client

options {
    directory "/var/cache/bind";
    recursion yes;
    
    // ACL: Refuse recursion to 10.10.0.50 (our client)
    allow-recursion { 
        !10.10.0.50;    # Deny our client
        10.10.0.0/24;   # Allow local network (except 50)
        127.0.0.1;      # Allow localhost
    };
    
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    forward only;
};

zone "lab.test" {
    type master;
    file "/etc/bind/zones/lab.test.zone";
};
